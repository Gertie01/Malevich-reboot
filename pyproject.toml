[project]
name = "rudalle-malevich"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "flask",
  "flask-cors",
  "rudalle==1.1.3",
  "torch",
  "transformers",
  "pillow",
]

[tool.uv]
extra-build-dependencies = { youtokentome = ["Cython"] }
override-dependencies = [
  "PyWavelets>=1.5.0",
  "opencv-python>=4.8.0",
  "numpy>=1.26.0",
  "transformers==4.30.2",
  "tokenizers==0.13.3",
]
